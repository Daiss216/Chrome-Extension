<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Globle Entry Drop</title>
    <link rel="stylesheet" href="bulma.min.css" />

    <!-- Fixed and stable width, solid structural height, prevent tiny responsive scrollbars -->
    <style>
      html,
      body {
        width: 320px;
        min-height: 200px;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div class="p-3">
      <h1 class="title is-3">Globle Entry Drop</h1>

      <div class="field">
        <label class="label">Status</label>
        <span class="tag is-success">Running</span>
        <span class="tag is-danger">Stopped</span>
      </div>
    </div>

    <div class="p-3">
      <div class="field">
        <label class="label">Location ID</label>
        <div class="select">
          <select id="locationId">
            <option value="los_angeles">Los Angeles</option>
            <option value="new_york">New York</option>
            <option value="seattle">Seattle</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="label">Start Date</label>
        <div class="control">
          <input type="date" class="input" id="startdate" />
        </div>
      </div>

      <div class="field">
        <label class="label">End Date</label>
        <div class="control">
          <input type="date" class="input" id="enddate" />
        </div>
      </div>
    </div>

    <div class="p-3">
      <div class="p-2">
        <button class="button is-success is-fullwidth" id="startButton">
          Save & Start
        </button>
      </div>

      <div class="p-2">
        <button class="button is-danger is-fullwidth" id="stopButton">
          Stop
        </button>
      </div>
    </div>
  </body>
  <script src="popup.js"></script>
</html>
